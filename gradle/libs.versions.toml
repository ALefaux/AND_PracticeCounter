[versions]
activityCompose = "1.9.3"
androidCompileSdk = "35"
androidDesugar = "2.1.4"
androidGradlePlugin = "8.7.3"
androidMinSdk = "26"
androidTargetSdk = "35"
androidTools = "31.7.3"
androidxComposeNavigation = "2.8.5"
androidxLifecycleViewModelCompose = "2.8.7"
appcompat = "1.7.0"
appwrite = "6.0.0"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
hilt = "2.51.1"
kotlin = "2.1.0"
kotlinxImmutable = "0.3.8"
kotlinxSerialization = "1.7.3"
ksp = "2.1.0-1.0.29"
material = "1.12.0"
timber = "5.0.1"

[libraries]
android-desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugar" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxComposeNavigation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycleViewModelCompose" }
jakewharton-timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Kotlin serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# End

# Kotlin immutable
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }
# End

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# End

# AppWrite
appwrite-android = { group = "io.appwrite", name = "sdk-for-android", version.ref = "appwrite" }
# End

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
# End

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# For the project
practicecounter-android-application = { id = "practicecounter.android.application", version = "unspecified" }
practicecounter-android-application-compose = { id = "practicecounter.android.application.compose", version = "unspecified" }
practicecounter-android-hilt = { id = "practicecounter.android.hilt", version = "unspecified" }
practicecounter-data-local = { id = "practicecounter.data.local", version = "unspecified" }
practicecounter-data-remote = { id = "practicecounter.data.remote", version = "unspecified" }
practicecounter-di = { id = "practicecounter.di", version = "unspecified" }
practicecounter-domain = { id = "practicecounter.domain", version = "unspecified" }
practicecounter-model-ui = { id = "practicecounter.model.ui", version = "unspecified" }
practicecounter-panes = { id = "practicecounter.panes", version = "unspecified" }
practicecounter-presentation = { id = "practicecounter.presentation", version = "unspecified" }
practicecounter-ui = { id = "practicecounter.ui", version = "unspecified" }
# End
