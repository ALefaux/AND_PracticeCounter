[versions]
activityCompose = "1.9.3"
androidGradlePlugin = "8.7.2"
androidTools = "31.7.2"
androidxLifecycleViewModelCompose = "2.8.7"
appcompat = "1.7.0"
appwrite = "6.0.0"
composeBom = "2024.11.00"
coreKtx = "1.15.0"
hilt = "2.51.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.26"
material = "1.12.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycleViewModelCompose" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# End

# AppWrite
appwrite-android = { group = "io.appwrite", name = "sdk-for-android", version.ref = "appwrite" }
# End

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
# End

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# For the project
practicecounter-android-application = { id = "practicecounter.android.application", version = "unspecified" }
practicecounter-android-application-compose = { id = "practicecounter.android.application.compose", version = "unspecified" }
practicecounter-android-hilt = { id = "practicecounter.android.hilt", version = "unspecified" }
practicecounter-android-feature = { id = "practicecounter.android.feature", version = "unspecified" }
practicecounter-android-library-compose = { id = "practicecounter.android.library.compose", version = "unspecified" }
practicecounter-android-library = { id = "practicecounter.android.library", version = "unspecified" }
# End
